# 一键部署：把本文件和 .env 复制到服务器同一目录，执行 docker compose up -d
# 镜像由 GitHub Actions 自动构建并推到 ghcr.io（见 .github/workflows/docker.yml）。
# 访问 http://<服务器>:${WEB_PORT}，前端容器把 /api 转发到后端；后端首次启动自动建表并导入种子数据。
services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=${DB_TIMEZONE:-+08:00}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-scaffold_system}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --save 60 1 --appendonly yes ${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/nightyuyyy/scaffold-backend}:${IMAGE_TAG:-latest}
    environment:
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置至少 32 字节的 JWT_SECRET}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-7200}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-scaffold_system}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_TIMEZONE: ${DB_TIMEZONE:-+08:00}
      DB_AUTO_INIT: ${DB_AUTO_INIT:-true}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 如需直接访问后端接口（不经前端 nginx），取消下面两行注释
    # ports:
    #   - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/nightyuyyy/scaffold-frontend}:${IMAGE_TAG:-latest}
    environment:
      BACKEND_UPSTREAM: backend:8080
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
